version: "3.8"

services:
  server:
    build:
      context: .
    container_name: my_express_server
    ports:
      - "${PORT}:8080"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:${DB_PASSWORD}@db:5432/${POSTGRES_DB}
    volumes:
      - .:/usr/src/server
      - /usr/src/server/node_modules
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - my-express-network

  db:
    image: postgres:15-alpine
    container_name: my_postgres_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: myexpressdb
    ports:
      - "5432:5432"
    volumes:
      - my_postgres_data_dev:/var/lib/postgresql/data
    networks:
      - my-express-network
    restart: unless-stopped

volumes:
  my_postgres_data_dev:

networks:
  my-express-network:
    driver: bridge
